noob_id: cala-odl
noob_model: noob.tube.TubeSpecification
noob_version: 0.1.1.dev118+g64d81b7

input:
  source:
    type: cala.arrays.Frame
    scope: process
  epoch:
    type: int
    scope: process
  radius:
    type: int
    scope: tube

assets:
  buffer:
    type: cala.arrays.Buffer
    params:
      size: 100
    scope: runner
  footprints:
    type: cala.arrays.Footprints
    params:
      sparsify: True
    scope: runner
  traces:
    type: cala.arrays.Traces
    scope: runner
    params:
      zarr_path: traces/
      peek_size: 100
      flush_interval: 200
  pix_stats:
    type: cala.arrays.PixStats
    scope: runner
  comp_stats:
    type: cala.arrays.CompStats
    scope: runner
  overlaps:
    type: cala.arrays.Overlaps
    scope: runner
  residuals:
    type: cala.arrays.Buffer
    params:
      size: 100
    scope: runner

nodes:
  frame:
    type: cala.nodes.prep.package_frame
    depends:
      - frame: input.source
      - index: input.epoch

  prep:
    type: tube
    params:
      tube: cala-prep
    depends:
      - frame: frame.value

  ingest:
    type: tube
    params:
      tube: cala-ingest
    depends:
      - frame: prep.value
      - traces: assets.traces
      - footprints: assets.footprints
      - overlaps: assets.overlaps
      - pix_stats: assets.pix_stats
      - comp_stats: assets.comp_stats
      - residuals: assets.residuals

  cache:
    type: cala.nodes.omf.pixel_stats.fill_buffer
    depends:
      - buffer: assets.buffer
      - frame: prep.value
  segment:
    type: tube
    params:
      tube: cala-segment
    depends:
      - residual: assets.residuals
      - energy: ingest.value
      - radius: input.radius
      - footprints: assets.footprints
      - traces: assets.traces
      - frame_sum: assets.pix_stats
      - trace_sum: assets.comp_stats
      - overlaps: assets.overlaps
      - buffer: assets.buffer

  return:
    type: return
    depends:
      - prep: prep.value