noob_id: cala-fit
noob_model: noob.tube.TubeSpecification
noob_version: 0.1.1.dev209+g1cafe61
input:
  frame:
    scope: process
    type: cala.arrays.Frame
  traces:
    scope: process
    type: cala.arrays.Traces
  footprints:
    scope: process
    type: cala.arrays.Footprints
  overlaps:
    scope: process
    type: cala.arrays.Overlaps
  pix_stats:
    scope: process
    type: cala.arrays.PixStats
  comp_stats:
    scope: process
    type: cala.arrays.CompStats
  residuals:
    scope: process
    type: cala.arrays.Residuals

nodes:
  fit_trace:
    type: cala.nodes.omf.traces.Tracer
    params:
      tol: 0.001
      max_iter: 100
    depends:
      - traces: input.traces
      - footprints: input.footprints
      - frame: input.frame
      - overlaps: input.overlaps
  fit_frame_summary:
    type: cala.nodes.omf.pixel_stats.ingest_frame
    depends:
      - pixel_stats: input.pix_stats
      - frame: input.frame
      - new_traces: fit_trace.latest_trace
      - footprints: input.footprints
  fit_trace_summary:
    type: cala.nodes.omf.component_stats.ingest_frame
    depends:
      - component_stats: input.comp_stats
      - frame: input.frame
      - new_traces: fit_trace.latest_trace
  fit_footprints:
    type: cala.nodes.omf.footprints.Footprinter
    params:
      max_iter: 5
      ratio_lb: 0.10
    depends:
      - footprints: input.footprints
      - pixel_stats: fit_frame_summary.value
      - component_stats: fit_trace_summary.value
  fit_residual:
    type: cala.nodes.omf.residual.Residuer
    depends:
      - frame: input.frame
      - footprints: fit_footprints.footprints
      - traces: input.traces
      - residuals: input.residuals
  return:
    type: return
    depends:
      - energy: fit_residual.std
      - residual: fit_residual.movie
      - traces: fit_trace.traces
      - footprints: fit_footprints.footprints
      - frame_sum: fit_frame_summary.value
      - trace_sum: fit_trace_summary.value