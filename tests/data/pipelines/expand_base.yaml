noob_id: cala-expand
noob_model: noob.tube.TubeSpecification
noob_version: 0.1.1.dev209+g1cafe61

input:
  cell_size:
    scope: tube
    type: int
  energy:
    scope: process
    type: cala.arrays.Frame
  residual:
    scope: process
    type: cala.arrays.Residual
  traces:
    scope: process
    type: cala.arrays.Traces
  footprints:
    scope: process
    type: cala.arrays.Footprints
  frame_sum:
    scope: process
    type: cala.arrays.PixStats
  trace_sum:
    scope: process
    type: cala.arrays.CompStats
  overlaps:
    scope: process
    type: cala.arrays.Overlaps
  buffer:
    scope: process
    type: cala.arrays.Buffer

nodes:
  nmf:
    type: cala.nodes.segment.SliceNMF
    params:
      min_frames: 100
      detect_thresh: 3.0
      reprod_tol: 0.005
    depends:
      - residuals: input.residual
      - energy: input.energy
      - radius: input.cell_size
  catalog:
    type: cala.nodes.segment.Cataloger
    params:
      age_limit: 500
      shape_smooth_kwargs:
        ksize: [ 1, 1 ]
        sigmaX: 0
      trace_smooth_kwargs:
        sigma: 2
      merge_threshold: 0.95
      val_threshold: 0.8
      cnt_threshold: 25
    depends:
      - new_fps: nmf.new_fps
      - new_trs: nmf.new_trs
      - existing_fp: input.footprints
      - existing_tr: input.traces
  expand_update:
    type: cala.nodes.segment.update_assets
    depends:
      - new_footprints: catalog.new_footprints
      - new_traces: catalog.new_traces
      - footprints: input.footprints
      - traces: input.traces
      - pixel_stats: input.frame_sum
      - component_stats: input.trace_sum
      - overlaps: input.overlaps
      - buffer: input.buffer
  return:
    type: return
    depends:
      - traces: expand_update.traces
      - footprints: expand_update.footprints
      - frame_sum: expand_update.frame_sum
      - trace_sum: expand_update.trace_sum
      - overlaps: expand_update.overlaps
