noob_id: cala-persist

input:
  save_epoch:
    type: int
    scope: tube
  epoch:
    type: int
    scope: process
  footprints:
    type: cala.arrays.Footprints
    scope: process
  traces:
    type: cala.arrays.Traces
    scope: process

nodes:
  save_trace:
    type: cala.nodes.io.save_asset
    params:
      target_epoch: input.save_epoch  # 855999 (1000 * n_chunks - 1)
      path: traces_fin/
    depends:
      - asset: input.traces
      - curr_epoch: input.epoch

  save_shape:
    type: cala.nodes.io.save_asset
    params:
      target_epoch: input.save_epoch  # 855999 (1000 * n_chunks - 1)
      path: footprints_fin/
    depends:
      - asset: input.footprints
      - curr_epoch: input.epoch
