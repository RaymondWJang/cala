noob_id: cala-segment

input:
  cell_size:
    scope: tube
    type: int
  residual_frame:
    scope: process
    type: cala.arrays.Frame
  energy:
    scope: process
    type: cala.arrays.Frame
  footprints:
    scope: process
    type: cala.arrays.Footprints
  traces:
    scope: process
    type: cala.arrays.Traces

assets:
  residuals:
    type: cala.arrays.Buffer
    params:
      size: 100
    scope: runner

nodes:
  extend_residuals:
    type: cala.nodes.segment.extend_residuals
    depends:
      - residuals: assets.residuals
      - frame: input.residual_frame
  nmf:
    type: cala.nodes.segment.SliceNMF
    params:
      min_frames: 100
      detect_thresh: 3.0
      reprod_tol: 0.005
    depends:
      - residuals: extend_residuals.movie
      - energy: input.energy
      - detect_radius: input.cell_size
  catalog:
    type: cala.nodes.segment.Cataloger
    params:
      age_limit: 100
      shape_smooth_kwargs:
        ksize: [ 7, 7 ]
        sigmaX: 0
      trace_smooth_kwargs:
        sigma: 2
      merge_threshold: 0.95
      val_threshold: 0.8
      cnt_threshold: 20
    depends:
      - new_fps: nmf.new_fps
      - new_trs: nmf.new_trs
      - existing_fp: input.footprints
      - existing_tr: input.traces
  return:
    type: return
    depends:
      - new_traces: catalog.new_traces
      - new_footprints: catalog.new_footprints